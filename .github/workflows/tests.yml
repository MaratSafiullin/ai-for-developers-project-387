name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # On a pull request, check the head commit of the PR branch rather than
      # the temporary merge commit; on push, github.sha as before.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Show Checked Out SHA
        id: sha
        run: |
          sha=$(git rev-parse HEAD)
          echo "git rev-parse HEAD: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup Application
        run: composer setup

      - name: Install Playwright System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run CI Checks
        id: ci-check
        run: composer ci:check

      # ci:check runs the browser tests last: when an earlier check fails, the
      # artifact holds only the SHA and the outcome, without results or traces.
      - name: Write Browser Evidence Summary
        if: always()
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          OUTCOME: ${{ steps.ci-check.outcome }}
        run: |
          mkdir -p browser-evidence
          echo "$SHA" > browser-evidence/sha.txt
          echo "$OUTCOME" > browser-evidence/outcome.txt

      - name: Upload Browser Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ steps.sha.outputs.sha }}
          path: |
            browser-evidence/
            playwright-report/results.json
            test-results/
          overwrite: true

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Image
        run: docker build --tag app .

      - name: Start Container
        run: docker run --detach --name app --env PORT=8080 --publish 8080:8080 app

      - name: Check Home Page Responds 200
        run: |
          for _ in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/ || true)
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "Home page did not respond 200, last status: $status"
          docker logs app
          exit 1
