name: claude

# The budget job finds the runs of a pull request by this title, so the title
# carries the pull request number. Issue runs get a different title and never
# count.
run-name: >-
  ${{
  (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
  && format('claude: PR #{0}', github.event.issue.number || github.event.pull_request.number)
  || format('claude: issue #{0}', github.event.issue.number)
  }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Every job declares its own permissions.
permissions: {}

# Runs of trusted agent calls on one pull request go one after another, from
# the budget check to the report, so a budget check always sees every earlier
# admitted run finished. Any other run gets a group of its own: GitHub keeps
# one pending run per group, and a stranger's comment must not cancel a queued
# trusted call. The trusted filter is repeated here because workflow-level
# concurrency reads only the github context.
concurrency:
  group: >-
    ${{
    (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
    contains(github.event.comment.body, '@claude') &&
    contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
    github.event.comment.user.type != 'Bot'
    && format('claude-pr-{0}', github.event.issue.number || github.event.pull_request.number)
    || format('claude-run-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  # Runs no model. On a pull request it counts the earlier admitted runs of
  # the agent from the Actions history, which the agent's tokens cannot
  # change, and decides whether the agent may start. An attempt counts when
  # its agent job was not skipped: a run that passed the trusted filter and
  # the budget, including cancelled, timed-out and re-run attempts. Untrusted
  # comments and runs refused by the budget skip the agent job and cost
  # nothing.
  # The trusted filter is written out in the concurrency group and in the if
  # of every job; a change to it goes to all copies.
  # The counter finds the jobs by their names, which are the job ids budget
  # and claude: do not give these jobs a name, or the budget stops counting.
  budget:
    if: >-
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      allowed: ${{ steps.count.outputs.allowed }}
      used: ${{ steps.count.outputs.used }}
      limit: ${{ steps.count.outputs.limit }}
      attempt: ${{ steps.count.outputs.attempt }}

    steps:
      - name: Count Admitted Runs
        id: count
        env:
          RUN_LIMIT: '3'
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          PR_CREATED_AT: ${{ github.event.issue.created_at || github.event.pull_request.created_at }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          title="claude: PR #$PR_NUMBER"
          # No run of this pull request is older than the pull request.
          gh api --paginate --method GET "repos/$REPO/actions/workflows/claude.yml/runs" \
            -f per_page=100 -f created=">=$PR_CREATED_AT" \
            | jq -r --arg title "$title" '.workflow_runs[] | select(.display_title == $title) | .id' \
            | sort -u > runs.txt

          used=0
          while read -r run_id; do
            # filter=all lists the jobs of every attempt of the run. An attempt
            # counts when its own budget check succeeded and its agent job was
            # not skipped, so a run cancelled while still queued costs
            # nothing. The current attempt is excluded: its agent job is still
            # pending.
            count=$(gh api --paginate --method GET "repos/$REPO/actions/runs/$run_id/jobs" \
              -f filter=all -f per_page=100 \
              | jq -s \
                --argjson run "$run_id" \
                --argjson current_run "$RUN_ID" \
                --argjson current_attempt "$RUN_ATTEMPT" \
                '[.[].jobs[]]
                 | unique_by(.id)
                 | group_by(.run_attempt)
                 | map(select(
                     ($run != $current_run or .[0].run_attempt != $current_attempt) and
                     any(.[]; .name == "budget" and .conclusion == "success") and
                     any(.[]; .name == "claude" and .conclusion != "skipped")
                   ))
                 | length')
            echo "Run $run_id: $count admitted attempt(s)."
            used=$((used + count))
          done < runs.txt

          if [ "$used" -lt "$RUN_LIMIT" ]; then
            allowed=true
          else
            allowed=false
          fi
          echo "Pull request #$PR_NUMBER: $used of $RUN_LIMIT admitted runs used, allowed: $allowed."
          {
            echo "allowed=$allowed"
            echo "used=$used"
            echo "limit=$RUN_LIMIT"
            echo "attempt=$RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Бюджет агента для PR #$PR_NUMBER"
            echo
            echo "Использовано допущенных запусков: $used из $RUN_LIMIT. Запуск допущен: $allowed."
          } >> "$GITHUB_STEP_SUMMARY"

  claude:
    needs: budget
    # Only a trusted human comment that mentions the agent reaches the model.
    # Any other event finishes here without calling the provider. In an issue
    # there is no budget. On a pull request the budget job must have admitted
    # this very attempt: Re-run failed jobs reuses the budget job of an earlier
    # attempt, so such a re-run skips the agent instead of bypassing the check.
    if: >-
      !cancelled() &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request) ||
        (needs.budget.outputs.allowed == 'true' && needs.budget.outputs.attempt == github.run_attempt)
      )
    runs-on: ubuntu-latest
    # The agent step has its own timeout, so a timeout of the agent can be told
    # from other errors. The job timeout leaves room for the preparation steps
    # and only catches a hung preparation.
    timeout-minutes: 80
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # The Claude GitHub App token, obtained through the OIDC exchange, posts the
    # comments, pushes branches and opens pull requests. The workflow token only
    # serves `gh` in the issue tracker skills, so it gets nothing beyond issue
    # and pull request access.
    # It is scoped to this repository, so `gh api`, which links sub-issues and
    # blocking dependencies, cannot write anywhere else or go past these scopes.
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    env:
      # implement-spec builds several tickets test-first and ends with a review.
      # The repository variable AGENT_TIMEOUT_MINUTES overrides the default
      # without a change to this file: claude-code-action refuses to run when
      # the workflow file differs from the default branch, so a pull request
      # cannot try out another value. Keep it below the job timeout.
      AGENT_TIMEOUT_MINUTES: ${{ vars.AGENT_TIMEOUT_MINUTES || '60' }}
    outputs:
      reason: ${{ steps.outcome.outputs.reason }}

    steps:
      # A missing key fails here, as a preparation step, and the report says
      # infra rather than agent_failed. The step only tests that the key is set.
      - name: Check Model Key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "The ANTHROPIC_API_KEY secret is not set."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install PHP Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate Project Skills
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan boost:update --no-interaction

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Feature tests render the Inertia root view, which needs the Vite
      # manifest, and the contract generator needs the npm packages. These
      # steps take the parts of `composer setup` the agent needs: it migrates no
      # database (tests use SQLite in memory) and installs no Playwright.
      - name: Install JS Dependencies and Build Frontend
        run: |
          npm ci
          npm run build

      # The commit-msg hook checks the agent's commits against Conventional
      # Commits, as it does locally.
      - name: Enable Git Hooks
        run: git config core.hooksPath .githooks

      # Classify Outcome tells a timeout of the agent step by the time elapsed
      # since here.
      - name: Record Agent Start
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Mention (tag) mode: the comment is the task, the appended system prompt
      # adds the rules of this repository. The text is single-quoted for the
      # action's shell-quote parser: inside it there are no apostrophes, no
      # dollar signs and no lines starting with a hash sign.
      # mcp__github__create_pull_request turns on the GitHub MCP server of the
      # action with the Claude App token, so the pull request comes from
      # claude[bot] and starts CI and the automatic review without approval.
      - name: Run Claude
        id: claude
        timeout-minutes: ${{ fromJSON(env.AGENT_TIMEOUT_MINUTES) }}
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: '@claude'
          show_full_output: false
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: mattpocock-skills@claude-plugins-official
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Skill,Agent,Task,Edit,Write,mcp__github__create_pull_request,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(php artisan test:*),Bash(php artisan make:*),Bash(vendor/bin/pint:*),Bash(vendor/bin/phpstan:*),Bash(npm run contract:generate),Bash(npm run build),Bash(npm run check:fix)"
            --append-system-prompt 'Rules for running in GitHub Actions in this repository.

            Code changes and tests:
            - Build code changes test-first with the tdd skill. Run the narrow checks while working: php artisan test --compact <path>, vendor/bin/pint --dirty --format agent, vendor/bin/phpstan analyse --memory-limit=1G, and npm run check:fix after TS or React changes.
            - After editing contract/main.tsp, run npm run contract:generate and commit the regenerated contract/openapi.yaml and resources/js/api/.
            - If a new page or route needs a fresh Vite manifest or Wayfinder routes, run npm run build.
            - Browser tests and the full composer ci:check are not run here: CI runs them on the pull request.
            - Write commit messages by the Commit Messages rules in AGENTS.md.

            Pull requests:
            - When you were triggered from an issue and changed code, open the pull request yourself with mcp__github__create_pull_request: base main, head the current branch, not a draft. Open exactly one, at the very end, after all commits are pushed. Put its link in your comment instead of a Create a PR link.
            - When you were triggered from a pull request, push to its branch and never open another pull request.
            - Write the title and the body by the Pull Requests rules in AGENTS.md: the body follows .github/pull_request_template.md. In Evidence, list the checks you ran here with their results.

            implement-spec:
            - The skill cannot be invoked through the Skill tool. Open its SKILL.md in the installed mattpocock-skills plugin and follow it with these adaptations.
            - The action has already created the branch, and you cannot create branches or merge. That branch is the integration branch: implement the tickets one after another in it, in the order of the task graph, each built with the tdd skill and committed separately.
            - Subagents are allowed, for example for exploration. No worktrees, no per-ticket branches, no merges.
            - Keep the final code-review step and commit the fixes it calls for.
            - Instead of the draft pull request of the skill, open the single pull request described above once all tickets and the review fixes are committed.'

      # With show_full_output: false the action logs no tool calls. This step
      # prints the tools the agent called and its Bash commands, without their
      # output, so the log shows which tests and checks ran. Tool output could
      # hold secrets and the log of a public repository is public.
      # A failed run may not set the output, but the action still writes the
      # file at its default path in RUNNER_TEMP.
      - name: List Agent Tool Calls
        if: always()
        # Logging only: an unreadable file must not fail the agent's job.
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          EXECUTION_FILE="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo "No execution file at $EXECUTION_FILE."
            exit 0
          fi
          jq -r '
            .[]
            | select(.type == "assistant")
            | .message.content[]?
            | select(.type == "tool_use")
            | if .name == "Bash" then "Bash: \(.input.command)" else .name end
          ' "$EXECUTION_FILE"

      # Names the outcome for the report job. A failed preparation leaves the
      # agent step unrun: infra. A step timeout and a manual cancel both stop
      # the agent step, so the elapsed time tells a timeout apart.
      - name: Classify Outcome
        id: outcome
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
          STARTED_AT: ${{ steps.start.outputs.at }}
        run: |
          case "$AGENT_OUTCOME" in
            success)
              reason=success
              ;;
            failure | cancelled)
              elapsed=$(( $(date +%s) - STARTED_AT ))
              if [ "$elapsed" -ge $(( AGENT_TIMEOUT_MINUTES * 60 )) ]; then
                reason=timeout
              else
                reason=agent_failed
              fi
              ;;
            *)
              reason=infra
              ;;
          esac
          echo "Agent step: ${AGENT_OUTCOME:-not run}, reason: $reason."
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

  # Runs no model. After the agent job, whatever its outcome, it posts a report
  # to the pull request when the call did not succeed. On success the agent
  # answers itself and no report is posted. The report must not mention the
  # trigger phrase.
  report:
    needs: [budget, claude]
    if: >-
      always() &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Post Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          BUDGET_RESULT: ${{ needs.budget.result }}
          BUDGET_ALLOWED: ${{ needs.budget.outputs.allowed }}
          BUDGET_USED: ${{ needs.budget.outputs.used }}
          BUDGET_LIMIT: ${{ needs.budget.outputs.limit }}
          AGENT_RESULT: ${{ needs.claude.result }}
          AGENT_REASON: ${{ needs.claude.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          if [ "$BUDGET_RESULT" != "success" ]; then
            reason=infra
            details="Проверка бюджета не завершилась ($BUDGET_RESULT), агент не запускался."
          elif [ "$BUDGET_ALLOWED" != "true" ]; then
            reason=limit_exhausted
            details="Бюджет PR исчерпан: использовано $BUDGET_USED из $BUDGET_LIMIT допущенных запусков агента. Модель не вызывалась."
          elif [ "$AGENT_RESULT" = "success" ]; then
            echo "The agent succeeded and answers itself. No report."
            exit 0
          elif [ "$AGENT_RESULT" = "skipped" ]; then
            reason=infra
            details="Агент не запускался: проверка бюджета была из прошлой попытки прогона. Перезапускайте прогон целиком (Re-run all jobs), а не только упавшие задания."
          else
            # A job cancelled or lost before Classify Outcome leaves no reason.
            case "$AGENT_REASON" in
              timeout)
                reason=timeout
                details="Агент не уложился в тайм-аут шага и был остановлен."
                ;;
              agent_failed)
                reason=agent_failed
                details="Агент завершился с ошибкой или был отменён."
                ;;
              *)
                reason=infra
                details="Сбой подготовки задания агента ($AGENT_RESULT): не установлены зависимости, нет ключа модели или задание было прервано."
                ;;
            esac
          fi

          head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          {
            echo "## Агент остановлен: \`$reason\`"
            echo
            echo "**Статус: нужен человек.**"
            echo
            echo "$details"
            echo
            echo "- Причина: \`$reason\`"
            echo "- Последний SHA ветки PR: \`$head_sha\`"
            echo "- Логи: [прогон]($RUN_URL)"
            if [ -n "$BUDGET_USED" ]; then
              echo "- Бюджет: до этого запуска использовано $BUDGET_USED из $BUDGET_LIMIT допущенных запусков агента"
            fi
          } > report.md
          cat report.md
          gh pr comment "$PR_NUMBER" --body-file report.md
