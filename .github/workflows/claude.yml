name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# The Claude GitHub App token, obtained through the OIDC exchange, posts the
# comments, pushes branches and opens pull requests. The workflow token only
# serves `gh` in the issue tracker skills, so it gets nothing beyond issue and
# pull request access.
# It is scoped to this repository, so `gh api`, which links sub-issues and
# blocking dependencies, cannot write anywhere else or go past these scopes.
permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: read

jobs:
  claude:
    # Only a trusted human comment that mentions the agent reaches the model.
    # Any other event finishes here without calling the provider.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    # implement-spec builds several tickets test-first and ends with a review.
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install PHP Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate Project Skills
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan boost:update --no-interaction

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Feature tests render the Inertia root view, which needs the Vite
      # manifest, and the contract generator needs the npm packages. These
      # steps take the parts of `composer setup` the agent needs: it migrates no
      # database (tests use SQLite in memory) and installs no Playwright.
      - name: Install JS Dependencies and Build Frontend
        run: |
          npm ci
          npm run build

      # The commit-msg hook checks the agent's commits against Conventional
      # Commits, as it does locally.
      - name: Enable Git Hooks
        run: git config core.hooksPath .githooks

      # Mention (tag) mode: the comment is the task, the appended system prompt
      # adds the rules of this repository. The text is single-quoted for the
      # action's shell-quote parser: inside it there are no apostrophes, no
      # dollar signs and no lines starting with a hash sign.
      # mcp__github__create_pull_request turns on the GitHub MCP server of the
      # action with the Claude App token, so the pull request comes from
      # claude[bot] and starts CI and the automatic review without approval.
      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: '@claude'
          show_full_output: false
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: mattpocock-skills@claude-plugins-official
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Skill,Agent,Task,Edit,Write,mcp__github__create_pull_request,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(php artisan test:*),Bash(php artisan make:*),Bash(vendor/bin/pint:*),Bash(vendor/bin/phpstan:*),Bash(npm run contract:generate),Bash(npm run build),Bash(npm run check:fix)"
            --append-system-prompt 'Rules for running in GitHub Actions in this repository.

            Code changes and tests:
            - Build code changes test-first with the tdd skill. Run the narrow checks while working: php artisan test --compact <path>, vendor/bin/pint --dirty --format agent, vendor/bin/phpstan analyse --memory-limit=1G, and npm run check:fix after TS or React changes.
            - After editing contract/main.tsp, run npm run contract:generate and commit the regenerated contract/openapi.yaml and resources/js/api/.
            - If a new page or route needs a fresh Vite manifest or Wayfinder routes, run npm run build.
            - Browser tests and the full composer ci:check are not run here: CI runs them on the pull request.
            - Write commit messages by the Commit Messages rules in AGENTS.md.

            Pull requests:
            - When you were triggered from an issue and changed code, open the pull request yourself with mcp__github__create_pull_request: base main, head the current branch, not a draft. Open exactly one, at the very end, after all commits are pushed. Put its link in your comment instead of a Create a PR link.
            - When you were triggered from a pull request, push to its branch and never open another pull request.
            - Write the title and the body by the Pull Requests rules in AGENTS.md: the body follows .github/pull_request_template.md. In Evidence, list the checks you ran here with their results.

            implement-spec:
            - The skill cannot be invoked through the Skill tool. Open its SKILL.md in the installed mattpocock-skills plugin and follow it with these adaptations.
            - The action has already created the branch, and you cannot create branches or merge. That branch is the integration branch: implement the tickets one after another in it, in the order of the task graph, each built with the tdd skill and committed separately.
            - Subagents are allowed, for example for exploration. No worktrees, no per-ticket branches, no merges.
            - Keep the final code-review step and commit the fixes it calls for.
            - Instead of the draft pull request of the skill, open the single pull request described above once all tickets and the review fixes are committed.'

      # With show_full_output: false the action logs no tool calls. This step
      # prints the tools the agent called and its Bash commands, without their
      # output, so the log shows which tests and checks ran. Tool output could
      # hold secrets and the log of a public repository is public.
      # A failed run may not set the output, but the action still writes the
      # file at its default path in RUNNER_TEMP.
      - name: List Agent Tool Calls
        if: always()
        # Logging only: an unreadable file must not fail the agent's job.
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          EXECUTION_FILE="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo "No execution file at $EXECUTION_FILE."
            exit 0
          fi
          jq -r '
            .[]
            | select(.type == "assistant")
            | .message.content[]?
            | select(.type == "tool_use")
            | if .name == "Bash" then "Bash: \(.input.command)" else .name end
          ' "$EXECUTION_FILE"
